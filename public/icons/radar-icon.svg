<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </radialGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Radar Circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(16, 185, 129, 0.2)" stroke-width="3" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(16, 185, 129, 0.35)" stroke-width="3"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="rgba(16, 185, 129, 0.5)" stroke-width="3"/>

  <!-- Radar Crosshairs -->
  <line x1="256" y1="60" x2="256" y2="452" stroke="rgba(16, 185, 129, 0.2)" stroke-width="2"/>
  <line x1="60" y1="256" x2="452" y2="256" stroke="rgba(16, 185, 129, 0.2)" stroke-width="2"/>

  <!-- Radar Sweep Cone -->
  <path d="M256,256 L390,140 A180,180 0 0,0 256,76 Z" fill="url(#emeraldGrad)" opacity="0.25"/>

  <!-- Target Point / Opportunity Found -->
  <circle cx="340" cy="180" r="18" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="340" cy="180" r="8" fill="#ffffff"/>

  <!-- Center Pin -->
  <circle cx="256" cy="256" r="14" fill="#10b981" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="6" fill="#ffffff"/>

  <!-- Shopping Tag / Price badge in bottom right -->
  <g transform="translate(280, 280)">
    <rect x="0" y="0" width="160" height="150" rx="36" fill="#131e33" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>
    <text x="80" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#34d399" text-anchor="middle">OLX</text>
    <text x="80" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" fill="#fbbf24" text-anchor="middle">BH • MG</text>
  </g>
</svg>
