name: Radar OLX BH - Atualização e Deploy Pages

on:
  workflow_dispatch:
    inputs:
      new_product_name:
        description: 'Cadastrar Novo Produto (Ex: Notebook Dell G15)'
        required: false
        type: string
      new_product_query:
        description: 'Termo de busca na OLX BH (Ex: notebook dell g15)'
        required: false
        type: string
      new_product_target:
        description: 'Preço Alvo / Oportunidade em R$ (Ex: 3500)'
        required: false
        type: string
      new_product_min:
        description: 'Preço Mínimo anti-acessórios em R$ (Ex: 2000)'
        required: false
        type: string
      new_product_max:
        description: 'Preço Máximo em R$ (Ex: 5000)'
        required: false
        type: string
      new_product_negatives:
        description: 'Palavras Negativas separadas por vírgula (Ex: defeito, peças, tela trincada)'
        required: false
        type: string
  schedule:
    # Roda automaticamente às 07:00 e às 19:00 horário de Brasília (10:00 e 22:00 UTC)
    - cron: '0 10,22 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
      - 'public/data/**'
      - 'README.md'

# Permissões necessárias para gravar no repo e publicar no GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Permite apenas um deploy concorrente
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup do Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Varredura de Preços na OLX BH
        run: npm run update
        env:
          NEW_PRODUCT_NAME: ${{ inputs.new_product_name }}
          NEW_PRODUCT_QUERY: ${{ inputs.new_product_query }}
          NEW_PRODUCT_TARGET: ${{ inputs.new_product_target }}
          NEW_PRODUCT_MIN: ${{ inputs.new_product_min }}
          NEW_PRODUCT_MAX: ${{ inputs.new_product_max }}
          NEW_PRODUCT_NEGATIVES: ${{ inputs.new_product_negatives }}

      - name: Salvar Dados Atualizados no Repositório
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/database.json public/data/database.json rastreadores.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(radar): atualizacao automatica de precos e rastreadores [skip ci]"
            git pull --rebase -X theirs origin main || true
            git push origin HEAD:main || true
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload do Artefato do Site (public)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy para o GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
