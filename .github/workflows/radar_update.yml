name: Radar OLX BH - Atualização e Deploy Pages

on:
  workflow_dispatch: # Permite disparar manualmente pelo botão "Run workflow" no GitHub
  schedule:
    # Roda automaticamente às 07:00 e às 19:00 horário de Brasília (10:00 e 22:00 UTC)
    - cron: '0 10,22 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
      - 'public/data/**'
      - 'README.md'

# Permissões necessárias para gravar no repo e publicar no GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Permite apenas um deploy concorrente
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Setup do Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Varredura de Preços na OLX BH
        run: npm run update

      - name: Salvar Dados Atualizados no Repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/database.json public/data/database.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(radar): atualizacao automatica de precos [skip ci]" && git push)

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload do Artefato do Site (public)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy para o GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
